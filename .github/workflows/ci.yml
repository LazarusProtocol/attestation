name: Attestation Service CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Attestation Enclave & FROST Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python syntax
        run: python -m compileall -q attestation common tests

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify Enclave Dockerfile build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: lazarus-attestation-enclave:test

