name: lazarus-attestation

services:
  attestation:
    container_name: lazarus-attestation
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      LAZARUS_ENCLAVE_HOST: ${LAZARUS_ENCLAVE_HOST:-0.0.0.0}
      LAZARUS_ENCLAVE_PORT: ${LAZARUS_ENCLAVE_PORT:-8085}
      LAZARUS_SIGNING_MODE: ${LAZARUS_SIGNING_MODE:-frost_2_of_3}
      LAZARUS_MAX_HOURLY_OUTFLOW: ${LAZARUS_MAX_HOURLY_OUTFLOW:-50000000000}
      LAZARUS_ORACLE_SIGNING_SEED_HEX: ${LAZARUS_ORACLE_SIGNING_SEED_HEX:-}
      LAZARUS_ATTESTATION_API_KEY: ${LAZARUS_ATTESTATION_API_KEY:-}
    ports:
      - "${LAZARUS_ENCLAVE_PORT:-8085}:8085"
    networks:
      - lazarus-net
    restart: unless-stopped

networks:
  lazarus-net:
    driver: bridge
